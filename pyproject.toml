[project]
name = "vcmi-dev-tools"
version = "0.1.0"
description = "Development and contributor tools for VCMI mods"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "pillow>=12,<13",
]

[project.scripts]
vcmi-portraits = "vcmi_portrait_tools.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vcmi_portrait_tools"]
