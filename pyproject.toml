[project]
name = "vcmi-dev-tools"
version = "0.1.0"
description = "Development and contributor tools for VCMI mods"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "homm3data>=0.1.12,<0.2",
    "pillow>=12,<13",
]

[project.scripts]
vcmi-portraits = "vcmi_portrait_tools.cli:main"
vcmi-conflux-inventory = "vcmi_dev_tools.conflux_inventory:main"
vcmi-conflux-extract = "vcmi_dev_tools.conflux_extract:main"
vcmi-conflux-comfy-upscale = "vcmi_dev_tools.conflux_comfy_upscale:main"
vcmi-conflux-pack = "vcmi_dev_tools.conflux_pack:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vcmi_portrait_tools", "src/vcmi_dev_tools"]
